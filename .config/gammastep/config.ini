[general]
# Color temperature for daytime (non-eye-care period), 6500K is default (no color shift)
temp-day=6500
# Color temperature for night (eye-care period), 3600K is a comfortable warm temperature (adjustable)
temp-night=3600

# Enable smooth fading between day/night temperatures (0=disable, 1=enable)
fade=1

# Custom time intervals (core config, replace latitude/longitude judgment)
# Time to switch from day to night (start of eye-care mode): 20:00
dusk-time=20:00
# Time to switch from night to day (end of eye-care mode): 07:00
dawn-time=07:00

# Optional: Reduce screen brightness at night (0.1-1.0, 1.0 is original brightness)
# brightness-night=0.9

# Optional: Global gamma correction (fine-tune color, 0.8-1.0 is recommended)
# gamma=0.9

# Disable automatic location detection (we use fixed time instead)
location-provider=manual

# Manual location section (required by config syntax, values have no actual effect)
[manual]
lat=0.0
lon=0.0
