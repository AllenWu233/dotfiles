### Scripts and commands
#
# Xwayland HiDPI
xwayland disabled
# exec_always xwayland-satellite :0 -listenfd 132 -listenfd 131
# exec_always --no-startup-id xwayland-satellite :0 -listenfd 3 -listenfd 4
exec --no-startup-id xwayland-satellite :0
exec --no-startup-id DISPLAY=:0 xrdb -merge ~/.Xresources

exec ~/.config/wob/wobpipe
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec udiskie
exec keepassxc
exec thunderbird
exec fcitx5 -d
