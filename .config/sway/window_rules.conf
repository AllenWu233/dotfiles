## Set specific windows to floating mode
set $floating_size_x 2500 set $floating_size_y 1400

## upper left corner: (x,y)
set $floating_position_x 5
set $floating_position_y 45



for_window [shell="xwayland"] title_format "[XWayland] %title"

# for_window [window_type="menu"] floating enable
# for_window [window_type="dialog"] floating enable
# for_window [window_type="utility"] floating enable
# for_window [window_type="dropdown_menu"] floating enable
# for_window [window_type="popup_menu"] floating enable
# for_window [window_type="tooltip"] floating enable
# for_window [window_type="notification"] floating enable
for_window [window_role="app"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [title="Preferences$"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable
for_window [title="图片查看器"] floating enable, sticky enable
# for_window [app_id="thunderbird"] floating enable
for_window [app_id="^imv$"] floating enable, border 2
for_window [app_id="^mpv$"] floating enable
for_window [app_id="firefox" title="我的足迹"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
# for_window [class="Float"] floating enable, resize set 2000 1400, move absolute position center
for_window [app_id="engrampa"] floating enable
for_window [app_id="PrismLauncher"] floating enable

# for_window [app_id="steam"] floating enable
for_window [app_id="steam" title="好友列表" ] floating enable
for_window [app_id="steam" title="设置" ] floating enable


for_window [app_id="vim-everywhere"] {
    floating enable
    sticky enable
    resize set 1000 700
    move position center
}


for_window [app_id="[Tt]hunderbird"] {
    floating enable
    resize set $floating_size_x $floating_size_y
    move absolute position center
}

for_window [app_id="keepassxc"] {
    floating enable
    move absolute position center
}

## Waylyrics
for_window [app_id="waylyrics"] {
    floating enable
    border none
    sticky enable
    resize set 1600 200
    move window to position 60 850
}
no_focus [app_id="waylyrics"]


