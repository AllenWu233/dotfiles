# shp9500-parametric10.conf
# @author Allen
# @since 2025
# EQ for SHP9500 headphone
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "SHP9500 Oratory1990 Parametric 10-Band EQ"
            media.name       = "SHP9500 Parametric EQ"
            filter.graph = {
                nodes = [
                    # Preamp -6.4 dB (simulated with wide peak filter)
                    {
                        type  = builtin
                        name  = eq_preamp
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 0.70 "Gain" = -6.4 }
                    }

                    # 10-band Parametric EQ
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 105.0 "Q" = 0.70 "Gain" = 6.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 5734.0 "Q" = 2.84 "Gain" = -5.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 110.0 "Q" = 0.81 "Gain" = -3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 2130.0 "Q" = 2.76 "Gain" = 3.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 412.0 "Q" = 1.39 "Gain" = 1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.70 "Gain" = -2.4 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 1113.0 "Q" = 2.07 "Gain" = -0.6 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 7370.0 "Q" = 5.98 "Gain" = 2.1 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        control = { "Freq" = 4477.0 "Q" = 6.00 "Gain" = -1.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_10
                        label = bq_peaking
                        control = { "Freq" = 3566.0 "Q" = 6.00 "Gain" = 1.3 }
                    }
                ]
                links = [
                    { output = "eq_preamp:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.shp9500_parametric10"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.shp9500_parametric10"
                node.passive = true
            }
        }
    }
]
