[whipper]
# Automatically eject the disc after a successful rip
eject = always

[whipper.cd.rip]
# Root directory for your digital assets
output_directory = /home/Allen/Music/Rips

# TLMC-inspired template without the elusive [event] field
# This ensures a clean path that you can easily append to manually
#
# Example: [森羅万象]/2023-11-12 [SBCD-0024] 森羅万象 東方BEST ALBUM 『エモ』/(01) [あやぽんず＊，あよ] カリスマ煉獄天神.flac
# Note: the format char '%' must be represented '%%' to avoid interpolation errors
track_template = [%%A]/%%y [%%C] %%d/(%%t) [%%a] %%n
disc_template = [%%A]/%%y [%%C] %%d/%%d



# Path filters to ensure filesystem compatibility
path_filter_dot = True
path_filter_posix = True

[drive:ASUS%20%20%20%20%3ASDRW-08D3S-U%20%20%20%20%3AF511]
vendor = ASUS
