# vim:foldmethod=marker

# [Quick Start] {{{
bindsym $mod+Return workspace $ws1; exec $terminal
bindsym $mod+f workspace $ws2; exec $browser
bindsym $mod+Shift+f workspace $ws2; exec $browser -private-window
bindsym $mod+n workspace $ws3; exec $cloud-music; exec "killall waylyrics; waylyrics"
bindsym $mod+b workspace $ws6; exec $file-manager
bindsym $mod+Shift+b workspace $ws6; exec $terminal -e yazi
bindsym $mod+Shift+v exec ~/.local/bin/vim-everywhere
# bindsym $mod+Shift+n exec ~/.local/bin/fuzzel-emoji
# bindsym $mod+Shift+c exec ~/.local/bin/quick-menu
# }}}


# [Scripts] {{{ 
bindsym $mod+c exec ~/.local/bin/toggle-monitor-display
bindsym $mod+z exec ~/.local/bin/ime-bridge

# Arch WiKi Offline
# bindsym $mod+i exec ~/.local/bin/arch-wiki-dmenu
# bindsym $mod+Shift+i exec ~/.local/bin/arch-wiki-zh-cn-dmenu
# }}}


# [Screenshots] {{{
bindsym $mod+p exec --no-startup-id "spectacle -f -b"
bindsym $mod+Shift+p exec --no-startup-id "spectacle -r -b"
# }}}


# [Rofi] {{{
bindsym $mod+w exec rofi -show drun
bindsym $mod+Tab exec rofi -show window
bindsym $mod+Shift+n exec rofi -show emoji
# }}}


# [WM] {{{

# [[Basic]] {{{
# Kill focused window
bindsym $mod+q kill

# Reload i3 configuration file
bindsym $mod+Shift+c reload

# Restart i3 (run exec_always)
bindsym $mod+Shift+r restart

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
# Despite the name, also works for non-floating windows.
# Change normal to inverse to use left mouse button for resizing and right
# mouse button for dragging.
floating_modifier $mod

bindsym Ctrl+Mod1+Delete exec i3 exit
## }}}

# [[Moving Around]] {{{

# Move your focus around
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# Moves the container into the given direction.
# The optional pixel argument specifies how far the
# container should be moved if it is floating and
# defaults to 10 pixels. The optional ppt argument
# means "percentage points", and if specified it indicates
# how many points the container should be moved if it is
# floating rather than by a pixel value.
# move <left|right|down|up> [<amount> [px|ppt]]
bindsym $mod+Shift+$left move left 5ppt
bindsym $mod+Shift+$down move down 5ppt
bindsym $mod+Shift+$up move up 5ppt
bindsym $mod+Shift+$right move right 5ppt

bindsym $mod+Shift+g move absolute position center

bindsym $mod+x [urgent=latest] focus
## }}}

# [[Workspaces]] {{{
#
# Switch to workspace
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10
## }}}

# [[Layout Stuff]] {{{

# You can "split" the current object of your focus with
# $mod+g or $mod+v, for horizontal and vertical splits
# respectively.
bindsym $mod+g splith
bindsym $mod+v splitv

# Switch the current container between different layout styles
# bindsym $mod+s layout stacking
bindsym $mod+t layout tabbed
bindsym $mod+e layout toggle split

# Make the current focus fullscreen
bindsym $mod+F11 fullscreen

# Toggle the current focus between tiling and floating mode
bindsym $mod+Shift+space floating toggle

# Swap focus between the tiling area and the floating area
bindsym $mod+space focus mode_toggle

# Move focus to the parent container
# bindsym $mod+a focus parent

# Scratchpad:
#
# i3 has a "scratchpad", which is a bag of holding for windows.
# You can send windows there and get them back later.
#
# Move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+minus scratchpad show

## }}}

# [[Volume & Brightness]] {{{
#
# Use pactl to adjust volume in PulseAudio.
set $refresh_i3status killall -SIGUSR1 i3status
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && $refresh_i3status
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && $refresh_i3status
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status

# Volume Controls
bindsym $mod+Up          exec ~/.local/bin/volume-mic-xob volume up
bindsym $mod+Down        exec ~/.local/bin/volume-mic-xob volume down
bindsym $mod+M           exec ~/.local/bin/volume-mic-xob volume toggle

# Microphone Controls
bindsym $mod+Shift+Up    exec ~/.local/bin/volume-mic-xob mic up
bindsym $mod+Shift+Down  exec ~/.local/bin/volume-mic-xob mic down
bindsym $mod+Shift+m     exec ~/.local/bin/volume-mic-xob mic toggle

# Brightness Controls
bindsym $mod+Right       exec ~/.local/bin/brightnessctl-xob +5%
bindsym $mod+Left        exec ~/.local/bin/brightnessctl-xob 5%-
## }}}

# }}}


# [Modes] {{{

# [[Resizing Containers]] {{{
mode "󰩨 " {
    bindsym $left resize shrink width 50px
    bindsym $down resize grow height 50px
    bindsym $up resize shrink height 50px
    bindsym $right resize grow width 50px

    # Return to default mode
    bindsym $mod+r mode "default"
    bindsym Return mode "default"
    bindsym q mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "󰩨 "
## }}}

# [[Gaming]] {{{
mode " " {
    bindsym $left exec ~/.local/bin/mouse-tool hold left; mode "default"
    bindsym $right exec ~/.local/bin/mouse-tool hold right; mode "default"
    bindsym Shift+$left exec ~/.local/bin/mouse-tool loop left; mode "default"
    bindsym Shift+$right exec ~/.local/bin/mouse-tool loop right; mode "default"

    bindsym $mod+i mode "default"
    bindsym Return mode "default"
    bindsym q mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+i mode " "
## }}}
# }}}
