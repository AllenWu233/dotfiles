### Output configuration
#
# Example configuration:
#
#   output HDMI-A-1 resolution 1920x1080 position 1920,0
#
# You can get the names of your outputs by running: swaymsg -t get_outputs
#
set $monitor_laptop eDP-1
set $monitor_external DP-1


exec --no-startup-id xrandr \
    --output $monitor_external \
        --primary \
        --mode 1920x1080 \
        --rate 260.00 \
        --pos 0x0 \
        --rotate normal \
    --output $monitor_laptop --off

    # --output $monitor_laptop \
    #     --primary \
    #     --mode 2560x1600 \
    #     --rate 165.00 \
    #     --pos 1920x0

# exec --no-startup-id xrandr \
