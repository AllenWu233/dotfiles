# --- Monokai Color Palette (From tanvirtin/monokai.nvim) ---
set $base0  #222426
set $base1  #272a30
set $base2  #26292C
set $base3  #2E323C
set $base4  #333842
set $base5  #4d5154
set $base6  #9ca0a4
set $base7  #b1b1b1
set $base8  #e3e3e1
set $white  #f8f8f0
set $grey   #8F908A
set $black  #000000
set $pink   #f92672
set $green  #a6e22e
set $aqua   #66d9ef
set $yellow #e6db74
set $orange #fd971f
set $purple #ae81ff
set $red    #e95678

# --- Window Decoration (Direct variable usage) ---
# target                  border   bg       text     indicator child_border
client.focused            $aqua    $base0   $white   $purple   $purple
client.focused_inactive   $base4   $base0   $base7   $base4    $base4
client.unfocused          $base2   $base0   $base6   $base2    $base2
client.urgent             $red     $base0   $red     $red      $red
client.placeholder        $base2   $base0   $white   $base2    $base2
client.background         $base0

# --- Bar Configuration ---
bar {
    font pango:Iosevka Nerd Font 10.5
    status_command LANGUAGE=en_US i3blocks
    position top

    colors {
        # Bar background and status text
        background         $base0
        statusline         $base7
        focused_statusline $white
        focused_separator  $aqua

        # Workspace colors
        # target           border   bg       text
        focused_workspace  $base0   $purple  $base0
        active_workspace   $base0   $base4   $white
        inactive_workspace $base0   $base0   $base6
        urgent_workspace   $base0   $red     $white
    }
}
