# vim:foldmethod=marker

# [Floating] {{{

# [[Settings]] {{{
# Set windows size and position for floating windows
# Window size x
set $sx 2500
# Window size y
set $sy 1400
# Upper left corner: (x,y)
# Window position x
set $px 5
# Window position y
set $py 45
## }}}

# [[Window Type]] {{{
for_window [window_type="menu"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="dropdown_menu"] floating enable
for_window [window_type="popup_menu"] floating enable
for_window [window_type="tooltip"] floating enable
for_window [window_type="notification"] floating enable
## }}}

# [[Normal]] {{{
for_window [title="Preferences$"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable
for_window [title="图片查看器"] floating enable, sticky enable
for_window [class="^imv$"] floating enable, resize set $sx $sy, move absolute position center
for_window [class="^feh$"] floating enable
for_window [class="^mpv$"] floating enable
for_window [class="firefox" title="我的足迹"] floating enable
for_window [class="pavucontrol"] floating enable
for_window [class="nm-connection-editor"] floating enable
for_window [class="engrampa"] floating enable
for_window [class="PrismLauncher"] floating enable
for_window [class="^wps$"] floating enable
for_window [class="Lutris"] floating enable
for_window [title="FlClash" ] floating enable
for_window [class="^yad$" ] floating enable, sticky enable
for_window [title="vim-everywhere"] floating enable, sticky enable, resize set 1600 1000, move absolute position center
for_window [class="[Tt]hunderbird"] floating enable, resize set $sx $sy, move absolute position center
for_window [class="keepassxc"] floating enable, move absolute position center

for_window [class="steam" title="好友列表" ] floating enable
for_window [class="steam" title="设置" ] floating enable
# Wallpaper Engine
for_window [class="steam_app_431960"] floating enable, move position center

# Waylyrics {{{
for_window [class="Waylyrics"] floating enable, border none, sticky enable, \
    move window to position 470 1300
    # move window to position 150 820
# no_focus [class="Waylyrics"]

### }}}

## }}}

# }}}


# [Assign] {{{
# Specific worksapce for applications
assign [class="firefox"] $ws2
assign [class="spotify"] $ws3
assign [title="^Steam"] $ws4

assign [class="hmcl"] $ws5
assign [class="PrismLauncher"] $ws5
assign [class="minecraft"] $ws5
assign [title="GT: New Horizons"] $ws5

assign [class="thunar"] $ws6
assign [class="digikam"] $ws6

assign [class="obsidian"] $ws7

assign [class="TelegramDesktop"] $ws8
assign [class="discord"] $ws8

assign [class="wechat"] $ws9
assign [class="^QQ$"] $ws9

assign [class="qBittorrent"] $ws10
# }}}


# [Scratchpad] {{{
for_window [class="KeePassXC" title=".*\.kdbx.*"] move scratchpad
for_window [title="Mozilla Thunderbird"] move scratchpad
for_window [class="qBittorrent" title="qBittorrent Enhanced Edition"] move scratchpad
for_window [title="FlClash" ] move scratchpad
# }}}
