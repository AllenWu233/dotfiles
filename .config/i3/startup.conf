# vim:foldmethod=marker

# [Scripts & commands] {{{
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_always --no-startup-id "pkill picom; picom"
exec --no-startup-id ~/.config/xob/xobpipe
exec --no-startup-id dunst
exec --no-startup-id redshift
exec --no-startup-id udiskie
# }}}

# [Software] {{{
exec_always --no-startup-id fcitx5 -d
exec --no-startup-id keepassxc
exec --no-startup-id thunderbird
# exec --no-startup-id flclash
# exec --no-startup-id qbittorrent
# }}}

# [Idle] {{{
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock-fancy
exec --no-startup-id xset s 1800
exec --no-startup-id xset dpms 1810 1810 1810
# }}}
